<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Match effort and catch rate within each stratum</title>
<desc id="desc">960 weekday angler-hours times 1 fish per angler-hour gives 960 fish. 1,056 weekend angler-hours times 2 fish per angler-hour gives 2,112 fish. Adding the products gives 3,072 fish caught across June 1 through 16, with uncertainty from both effort and rates.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#315d58"/></marker></defs>
<rect width="1400" height="650" rx="26" fill="#f7f4eb"/>
<g font-family="Arial, sans-serif" fill="#203e3a" text-anchor="middle">
<text x="700" y="55" font-size="34" font-weight="bold">Multiply within strata, then add</text>
<text x="155" y="155" font-size="30" font-weight="bold">Weekday</text>
<text x="155" y="315" font-size="30" font-weight="bold">Weekend</text>
<g fill="#e6eeea" stroke="#315d58" stroke-width="2"><rect x="295" y="96" width="295" height="118" rx="16"/><rect x="685" y="96" width="295" height="118" rx="16"/><rect x="1070" y="96" width="280" height="118" rx="16"/><rect x="295" y="256" width="295" height="118" rx="16"/><rect x="685" y="256" width="295" height="118" rx="16"/><rect x="1070" y="256" width="280" height="118" rx="16"/></g>
<text x="442" y="145" font-size="36" font-weight="bold">960</text><text x="442" y="185" font-size="26">angler-hours</text>
<text x="638" y="170" font-size="40">×</text>
<text x="832" y="145" font-size="36" font-weight="bold">1</text><text x="832" y="185" font-size="26">fish / angler-hour</text>
<text x="1025" y="170" font-size="36">=</text>
<text x="1210" y="163" font-size="36" font-weight="bold">960 fish</text>
<text x="442" y="305" font-size="36" font-weight="bold">1,056</text><text x="442" y="345" font-size="26">angler-hours</text>
<text x="638" y="330" font-size="40">×</text>
<text x="832" y="305" font-size="36" font-weight="bold">2</text><text x="832" y="345" font-size="26">fish / angler-hour</text>
<text x="1025" y="330" font-size="36">=</text>
<text x="1210" y="246" font-size="32">+</text>
<text x="1210" y="323" font-size="36" font-weight="bold">2,112 fish</text>
<path d="M1210 378 L1210 435 L995 435" fill="none" stroke="#315d58" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="400" y="423" width="580" height="125" rx="20" fill="#315d58"/>
<text x="690" y="473" font-size="38" font-weight="bold" fill="#ffffff">3,072 fish caught</text>
<text x="690" y="515" font-size="26" fill="#ffffff">Full calendar period: June 1–16</text>
<text x="700" y="605" font-size="27">Carry uncertainty from both effort and rates into the total.</text>
</g></svg>
