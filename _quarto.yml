project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - figs/
    - assets/
    - CNAME

website:
  title: "Christopher Chizinski"
  description: "Human dimensions of wildlife & fisheries — research, code, and R notes."
  site-url: "https://chrischizinski.com"
  favicon: assets/images/logo.png
  navbar:
    left:
      - text: "About"
        href: index.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        text: GitHub
        href: https://github.com/chrischizinski
        aria-label: GitHub
      - icon: cloud
        text: Bluesky
        href: https://bsky.app/profile/chrischizinski.bsky.social
        aria-label: Bluesky
      - text: "Lab ↗"
        href: https://humandimensions.unl.edu
  page-footer:
    center: |
      <span class="footer-links">
      <a href="https://github.com/chrischizinski"><i class="bi bi-github"></i> GitHub</a>
      <a href="https://bsky.app/profile/chrischizinski.bsky.social"><i class="bi bi-cloud"></i> Bluesky</a>
      <a href="mailto:cchizinski2@unl.edu"><i class="bi bi-envelope"></i> Email</a>
      <a href="https://chrischizinski.com/blog.xml"><i class="bi bi-rss"></i> RSS</a>
      <a href="https://humandimensions.unl.edu"><i class="bi bi-people"></i> Lab</a>
      </span>
      <span class="footer-credit">© 2026 Christopher Chizinski · Built with <a href="https://quarto.org">Quarto</a></span>

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    include-in-header:
      text: |
        <!-- Cloudflare Web Analytics -->
        <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "df5dfaf0e39b4658b43226cb083be41f"}'></script>
    toc: true
    code-copy: true
    code-overflow: wrap
